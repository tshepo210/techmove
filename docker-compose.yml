version: '3.8'

services:
  sqlserver-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    env_file:
      - .env
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      # TCP probe using bash to check port 1433. Avoids dependency on mssql-tools/sqlcmd.
      test: ["CMD-SHELL", "bash -c \"for i in {1..60}; do (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1 && exit 0 || sleep 5; done; exit 1\""]
      interval: 10s
      timeout: 15s
      retries: 1
      start_period: 0s

  glms-api:
    build:
      context: .
      dockerfile: glms.Api/Dockerfile
    container_name: glms-backend-api
    depends_on:
      sqlserver-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver-db,1433;Database=GLMSDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-glms}
      - Jwt__Audience=${JWT_AUDIENCE:-glms_clients}
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "5001:80"

  glms-web:
    build:
      context: .
      dockerfile: glms/Dockerfile
    container_name: glms-frontend-web
    depends_on:
      - glms-api
    env_file:
      - .env
    environment:
      - ApiBaseUrl=http://glms-api:80
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "8081:80"

networks:
  default:
    driver: bridge
